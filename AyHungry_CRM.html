            <div class="hist-date">${fmtDatetime(i.fecha)}</div>
            <button class="btn btn-xs btn-secondary" onclick="editarTarea(${i.id})" title="Editar" style="padding:1px 6px;font-size:11px">✏️</button>
          </div>
        </div>
        ${i.nota?`<div class="hist-body">${i.nota}</div>`:''}
        ${i.tarea?`<div style="margin-top:4px;font-size:11px;background:var(--bg4);padding:3px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:6px">
          ✅ ${i.tarea} ${i.tareaFecha?'— '+fmtDate(i.tareaFecha):''}
          ${i.tareaCompletada?'<span style="color:var(--green)">✓ Completada</span>':'<button class="btn btn-xs btn-success" onclick="completarTarea('+i.id+');renderFichaTab(4,DB.clientes.find(x=>x.id==='+c.id+'))">Completar</button>'}
        </div>`:''}
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--text3);font-size:13px;padding:10px">Sin interacciones registradas</div>';

  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:13px;font-weight:600">${ints.length} interacciones</div>
      <button class="btn btn-primary btn-sm" onclick="openInter(${c.id})">➕ Nueva Interacción</button>
    </div>
    ${items}
  </div>`;
}

function autoFormatRUT(input){
  let v = input.value.replace(/[^0-9kK]/g,'');
  if(v.length>1){
    const body = v.slice(0,-1);
    const dv = v.slice(-1);
    const formatted = body.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    input.value = formatted+'-'+dv;
  }
}

function saveCliente(){
  const c = DB.clientes.find(x=>x.id===currentClienteId);
  if(!c) return;
  const g = id => document.getElementById(id);
  // Tab 0 — Info
  c.nombre    = g('f-nombre')?.value || c.nombre;
  c.contacto  = g('f-contacto')?.value || '';
  c.tel       = g('f-tel')?.value || '';
  c.email     = g('f-email')?.value || '';
  c.estado    = g('f-estado')?.value || c.estado;
  c.prioridad = g('f-prioridad')?.value || c.prioridad;
  c.canal        = g('f-canal')?.value || c.canal;
  c.canalDetalle = g('f-canal-detalle')?.value || '';
  c.fechaIni  = g('f-fechaIni')?.value || '';
  c.notas     = g('f-notas')?.value || '';
  c.enRiesgo  = g('f-enRiesgo')?.value || '';
  const mod1  = g('f-mod1')?.checked;
  const mod2  = g('f-mod2')?.checked;
  c.modulos   = [];
  if(mod1) c.modulos.push('modulo1');
  if(mod2) c.modulos.push('modulo2');

  // Validación Técnica requiere al menos un módulo
  if(c.estado === 'validacion_bot' && c.modulos.length === 0){
    showToast('⚠️ Validación Técnica requiere al menos un módulo activo', 'error');
    // Mostrar aviso en la ficha sin cerrar
    const estadoSel = g('f-estado');
    if(estadoSel){
      estadoSel.style.borderColor = 'var(--red)';
      setTimeout(()=>estadoSel.style.borderColor='', 2500);
    }
    return;
  }

  // Tab 1 — Ficha Google (multi-local)
  c.cantidadLocales = parseInt(g('f-cantidadLocales')?.value)||1;
  c.locales = ensureLocales(c);
  c.locales.forEach((l,i)=>{
    const brEl = g(`f-br-${i}`);
    const fmEl = g(`f-fm-${i}`);
    const nmEl = g(`f-local-nombre-${i}`);
    if(brEl) l.botonReserva = brEl.value;
    if(fmEl) l.fichaMatch   = fmEl.value;
    if(nmEl) l.nombre       = nmEl.value;
  });
  c.fichaGoogleNota = g('f-fichaGoogleNota')?.value || '';
  // Tab 2 — Prueba/Pago
  c.iniciTipo      = g('f-iniciTipo')?.value || c.iniciTipo;
  c.pagoEstado     = g('f-pagoEstado')?.value || c.pagoEstado;
  c.pruebaInicio   = g('f-pruebaInicio')?.value || '';
  c.pruebaFin      = g('f-pruebaFin')?.value || '';
  c.pruebaResultado= g('f-pruebaResultado')?.value || '';
  c.monedaTipo     = g('f-monedaTipo')?.value || 'CLP';
  c.monto          = g('f-monto')?.value || '';
  c.metodoPago     = g('f-metodoPago')?.value || c.metodoPago;
  c.diaPago        = g('f-diaPago')?.value || '';
  c.proxima        = g('f-proxima')?.value || '';
  c.fechaProx      = g('f-fechaProx')?.value || '';
  // Tab 3 — Facturación
  c.rut            = g('f-rut')?.value || '';
  c.nombreFiscal   = g('f-nombreFiscal')?.value || '';
  c.direccionFiscal= g('f-direccionFiscal')?.value || '';
  c.correoFiscal   = g('f-correoFiscal')?.value || '';
  c.contactoCierre = g('f-contactoCierre')?.value || '';

  saveDB();
  showToast('Cliente guardado ✓');
  // Cerrar ficha y refrescar la vista actual
  document.getElementById('modal-ficha').style.display = 'none';
  currentClienteId = null;
  showView(currentView);
}

function openInter(clienteId, interId=null){
  interClienteId = clienteId;

  document.getElementById('inter-modal-title').textContent = interId ? '✏️ Editar Interacción' : '➕ Registrar Interacción';
  const now = new Date();
  const local = new Date(now - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  archivoBase64 = null; archivoNombre = '';
  document.getElementById('i-archivo-preview').style.display = 'none';
  // Pre-fill si es edición
  if(interId){
    const inter = DB.interacciones.find(x=>x.id===interId);
    if(inter){
      document.getElementById('i-tipo').value       = inter.tipo||'whatsapp';
      document.getElementById('i-fecha').value      = inter.fecha?.slice(0,16)||local;
      document.getElementById('i-nota').value       = inter.nota||'';
      document.getElementById('i-tarea').value      = inter.tarea||'';

      document.getElementById('i-reunion-lugar').value   = inter.reunionLugar||'';
      document.getElementById('i-reunion-duracion').value= inter.reunionDuracion||'60';
      if(inter.archivoNombre){

        archivoNombre = inter.archivoNombre;
        document.getElementById('i-archivo-nombre').textContent = inter.archivoNombre;
        document.getElementById('i-archivo-size').textContent = '';
        document.getElementById('i-archivo-preview').style.display = 'flex';
      }
    }
  } else {
    document.getElementById('i-tipo').value        = 'whatsapp';
    document.getElementById('i-fecha').value       = local;
    document.getElementById('i-nota').value        = '';
    document.getElementById('i-tarea').value       = '';
    document.getElementById('i-tarea-fecha').value = '';
    document.getElementById('i-reunion-titulo').value   = '';
    document.getElementById('i-reunion-lugar').value    = '';
    document.getElementById('i-reunion-duracion').value = '60';
  }
  toggleReunionFields();
  if(clienteId===null){
    const existing = document.getElementById('i-cliente-sel');
    if(!existing){
      const sel = document.createElement('div');
      sel.innerHTML = `<div class="form-group" style="margin-bottom:10px">
        <label>Cliente</label>
        <select id="i-cliente-sel">
          <option value="">— Seleccionar —</option>
          ${DB.clientes.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
        </select>
      </div>`;
      document.querySelector('#modal-inter .modal-body').prepend(sel.firstElementChild);
    }
  } else {
    const existing = document.getElementById('i-cliente-sel');
    if(existing) existing.parentElement.remove();
  }
  document.getElementById('modal-inter').style.display = 'flex';
}

function closeInter(){
  document.getElementById('modal-inter').style.display = 'none';
  const existing = document.getElementById('i-cliente-sel');
  if(existing) existing.parentElement.remove();
  archivoBase64 = null; archivoNombre = '';
  editingInterId = null;
}

function toggleReunionFields(){
  const tipo = document.getElementById('i-tipo')?.value;
  document.getElementById('reunion-fields').style.display = tipo==='reunion' ? 'block' : 'none';
}

function abrirGoogleCalendar(){
  const titulo   = document.getElementById('i-reunion-titulo').value || 'Reunión AyHungry';
  const fechaVal = document.getElementById('i-fecha').value;
  const durMin   = parseInt(document.getElementById('i-reunion-duracion').value)||60;
  const lugar    = document.getElementById('i-reunion-lugar').value || '';
  const nota     = document.getElementById('i-nota').value || '';
  if(!fechaVal){ showToast('Ingresa fecha y hora primero','error'); return; }
  const start  = new Date(fechaVal);
  const end    = new Date(start.getTime() + durMin*60000);
  const fmt    = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const params = new URLSearchParams({
    action:'TEMPLATE',
    text: titulo,
    dates: `${fmt(start)}/${fmt(end)}`,
    details: nota,
    location: lugar,
  });
  window.open('https://calendar.google.com/calendar/render?'+params.toString(), '_blank');
}

function previewArchivo(input){
  const file = input.files[0];
  if(!file) return;
  const maxMB = 5;
  if(file.size > maxMB*1024*1024){ showToast(`Archivo muy grande (máx ${maxMB}MB)`,'error'); input.value=''; return; }
  archivoNombre = file.name;
  document.getElementById('i-archivo-nombre').textContent = file.name;
  document.getElementById('i-archivo-size').textContent = '('+Math.round(file.size/1024)+' KB)';
  document.getElementById('i-archivo-preview').style.display = 'flex';
  const reader = new FileReader();
  reader.onload = e => { archivoBase64 = e.target.result; };
  reader.readAsDataURL(file);
}

function clearArchivo(){
  archivoBase64=null; archivoNombre='';
  document.getElementById('i-archivo').value='';
  document.getElementById('i-archivo-preview').style.display='none';
}

function saveInteraccion(){
  let cid = interClienteId;
  if(cid===null){
    const sel = document.getElementById('i-cliente-sel');
    cid = sel ? parseInt(sel.value) : null;
    if(!cid){ showToast('Selecciona un cliente','error'); return; }
  }
  const data = {
    clienteId: cid,
    tipo:          document.getElementById('i-tipo').value,
    fecha:         document.getElementById('i-fecha').value || new Date().toISOString(),
    nota:          document.getElementById('i-nota').value,
    tarea:         document.getElementById('i-tarea').value,
    tareaFecha:    document.getElementById('i-tarea-fecha').value,
    reunionTitulo: document.getElementById('i-reunion-titulo').value,
    reunionLugar:  document.getElementById('i-reunion-lugar').value,
    reunionDuracion: document.getElementById('i-reunion-duracion').value,
    archivoBase64: archivoBase64,
    archivoNombre: archivoNombre,
  };
  if(editingInterId){
    const inter = DB.interacciones.find(x=>x.id===editingInterId);
    if(inter){ Object.assign(inter, data); }
  } else {
    data.id = DB.nextIId++;
    data.tareaCompletada = false;
    DB.interacciones.push(data);
  }
  saveDB();
  closeInter();
  buildNav(); // actualiza badge de tareas
  if(currentClienteId===cid){
    const c = DB.clientes.find(x=>x.id===cid);
    if(c) renderFichaTab(4, c);
  }
  showToast(editingInterId ? 'Interacción actualizada ✓' : 'Interacción guardada ✓');
  if(currentView==='historial'||currentView==='tareas') showView(currentView);
}

function editarTarea(iid){

  delete c.deletedAt;

function hardDeleteCliente(id){
  const c = DB.clientes.find(x=>x.id===id);
  if(!c) return;
  const nombre = c.nombre || 'este cliente';
  if(!confirm('¿Eliminar permanentemente "' + nombre + '"?')) return;
  if(!confirm('Segunda confirmación: esta acción NO se puede deshacer. ¿Continuar?')) return;
  DB.clientes = DB.clientes.filter(x=>x.id!==id);
  DB.interacciones = DB.interacciones.filter(x=>x.clienteId!==id);
  saveDB();
  showToast('🗑️ Cliente eliminado definitivamente');
  showView('datos');

  const eliminados = DB.clientes.filter(c=>c.deleted);
  if(eliminados.length === 0){
    return '<div style="color:var(--text3);font-size:13px;padding:12px 0">🗑️ La papelera está vacía</div>';

  return eliminados.map(c=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <span style="flex:1;font-size:13px"><strong>${esc(c.nombre)}</strong> <span style="color:var(--text3)">— ${c.contacto||''}</span></span>

function showToast(msg, type='success'){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#22c55e;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;transition:.3s;box-shadow:0 4px 16px rgba(0,0,0,.3)';
    document.body.appendChild(t);
  }
  t.style.background = type==='error'?'#ef4444':'#22c55e';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(()=>t.style.opacity='0', 2500);
}

function esc(str){ return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Asegura que c.locales tiene exactamente c.cantidadLocales elementos
function ensureLocales(c){
  const n = Math.max(1, parseInt(c.cantidadLocales)||1);
  if(!Array.isArray(c.locales)) c.locales = [];
  // Rellenar si faltan
  while(c.locales.length < n){
    // Replicar el primero como base
    const base = c.locales[0]||{nombre:'',botonReserva:'pendiente',fichaMatch:'pendiente'};
    c.locales.push({nombre:'', botonReserva: base.botonReserva, fichaMatch: base.fichaMatch});
  }
  // Recortar si sobran
  return c.locales.slice(0, n);
}

// Cuando cambia la cantidad de locales desde Info General, re-renderiza Ficha Google
function syncLocalesUI(val){
  const c = DB.clientes.find(x=>x.id===currentClienteId);
  if(!c) return;
  // Primero guardar nombres ya escritos en Info General
  for(let i=0; i<(c.cantidadLocales||1); i++){
    const nmEl = document.getElementById(`f-local-nombre-${i}`);
    if(nmEl && c.locales[i]) c.locales[i].nombre = nmEl.value;
  }
  c.cantidadLocales = Math.max(1, parseInt(val)||1);
  c.locales = ensureLocales(c);
  // Re-renderizar pestaña Ficha Google
  renderFichaTab(1, c);
  // Re-renderizar info general para actualizar badge y lista
  renderFichaTab(0, c);
}

// Resumen agregado de estado de locales para vistas externas
function aggLocales(c, field){
  const locs = ensureLocales(c);
  const counts = {correcto:0, no_match:0, pendiente:0};
  locs.forEach(l => counts[l[field]=(l[field]||'pendiente')] = (counts[l[field]]||0)+1);
  const parts = [];
  if(counts.correcto)  parts.push(`<span style="color:var(--green)">✅${counts.correcto}</span>`);
  if(counts.no_match)  parts.push(`<span style="color:var(--red)">❌${counts.no_match}</span>`);
  if(counts.pendiente) parts.push(`<span style="color:var(--yellow)">⏳${counts.pendiente}</span>`);
  return parts.join(' ');
}

// ═══════════════════════════════════════════════════════════
// INIT — carga con fallback a IndexedDB si localStorage está vacío
// ═══════════════════════════════════════════════════════════
async function initApp(){
  // Siempre garantizamos que el CRM cargue aunque falle algo
  try{
    let loaded = false;

    // 1. Intentar localStorage (caso normal — sincrónico y siempre disponible)
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        // Solo usar si tiene clientes reales (evita cargar estado vacío/corrupto)
        if(parsed.clientes && parsed.clientes.length > 0){
          // Si los datos embebidos en el HTML tienen MÁS clientes que localStorage,
          // usar los embebidos (fuente de verdad actualizada desde disco)
          const embeddedCount = (typeof saved !== 'undefined' && saved.clientes) ? saved.clientes.length : 0;
          if(embeddedCount > parsed.clientes.length){
            console.warn('localStorage tiene ' + parsed.clientes.length + ' clientes, HTML embebido tiene ' + embeddedCount + ' — usando datos embebidos');
            DB = Object.assign({clientes:[],interacciones:[],nextId:1,nextIId:1,lastView:'dashboard'}, saved);
            saveDB(); // sincronizar localStorage con los datos completos
          } else {
            DB = Object.assign({clientes:[],interacciones:[],nextId:1,nextIId:1,lastView:'dashboard'}, parsed);
          }
          loaded = true;
        } else {
          console.warn('localStorage tiene datos vacíos — ignorando, usando backup');
          localStorage.removeItem(STORAGE_KEY); // limpiar estado malo
        }
      }
    }catch(e){ console.warn('localStorage error',e); }

    // 2. Si localStorage vacío → intentar IndexedDB (backup interno)
    if(!loaded){
      try{
        const idbJson = await loadLatestFromIDB();
        if(idbJson){
          const parsed = JSON.parse(idbJson);
          // Solo usar si tiene clientes reales
          if(parsed.clientes && parsed.clientes.length > 0){
            DB = Object.assign({clientes:[],interacciones:[],nextId:1,nextIId:1,lastView:'dashboard'}, parsed);
            localStorage.setItem(STORAGE_KEY, idbJson);
            loaded = true;
            setTimeout(()=>showToast('✅ Datos recuperados desde backup interno ('+DB.clientes.length+' clientes)'),1200);
          }
        }
      }catch(e){ console.warn('IDB recovery error',e); }
    }

    // 3. Intentar leer AyHungry_CRM_latest.json desde carpeta guardada (sin gesto del usuario si el permiso sigue activo)
    if(!loaded){
      try{
        const handle = await loadDirHandleFromIDB();
        if(handle){
          _backupDirHandle = handle;
          const perm = await handle.queryPermission({mode:'readwrite'});
          if(perm === 'granted'){
            const fh = await handle.getFileHandle('AyHungry_CRM_latest.json').catch(()=>null);
            if(fh){
              const file = await fh.getFile();
              const txt  = await file.text();
              const parsed = JSON.parse(txt);
              if(parsed.clientes && parsed.clientes.length > 0){
                // Solo restaurar si tiene al menos los 22 clientes base
                DB = Object.assign({clientes:[],interacciones:[],nextId:1,nextIId:1,lastView:'dashboard'}, parsed);
                localStorage.setItem(STORAGE_KEY, txt);
                loaded = true;
                setTimeout(()=>showToast('✅ Datos recuperados desde archivo JSON — '+DB.clientes.length+' clientes, '+DB.interacciones.length+' interacciones'),1200);
              }
            }
          } else if(perm === 'prompt'){
            // Necesita gesto del usuario — marcamos para mostrar banner
            window._needsFileReconnect = true;
          }
        }
      }catch(e){ console.warn('File JSON recovery error',e); }
    }

    // 4. Sin datos en ninguna fuente → cargar los 22 clientes base
    if(!loaded) seedDemoData();

  }catch(e){
    console.error('initApp error — cargando datos base como fallback',e);
    if(DB.clientes.length === 0) seedDemoData();
  }

  // Siempre renderizamos la UI
  buildNav();
  showView(DB.lastView||'dashboard');

  // Inicializar backup en segundo plano (no bloquea la UI)
  try{ initBackupSystem(); }catch(e){ console.warn('backup init error',e); }

  // Mostrar banner de reconexión si hace falta gesto de usuario
  if(window._needsFileReconnect) showReconnectBanner();
}

initApp();
