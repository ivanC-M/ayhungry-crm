<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyHungry CRM — Gestión Comercial SEO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#252836;--bg4:#2f3347;
  --accent:#6c63ff;--accent2:#8b83ff;--green:#22c55e;--red:#ef4444;
  --yellow:#eab308;--blue:#3b82f6;--orange:#f97316;--pink:#ec4899;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2f3347;--radius:10px;--shadow:0 4px 20px rgba(0,0,0,.4);
}
/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;overflow-y:auto;background:var(--bg)}
.logo{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.logo h2{font-size:18px;font-weight:700;color:var(--accent2)}
.logo span{font-size:11px;color:var(--text3);display:block;margin-top:2px}
nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;color:var(--text2);transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--accent2);border-left-color:var(--accent)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-section{padding:14px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.page{padding:24px;max-width:1400px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700}
.page-subtitle{font-size:13px;color:var(--text3);margin-top:2px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg4)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{filter:brightness(1.1)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{filter:brightness(1.1)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:1100px){.grid-5{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr}}
/* STAT CARD */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card .sc-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-card .sc-value{font-size:26px;font-weight:700;line-height:1}
.stat-card .sc-sub{font-size:12px;color:var(--text2);margin-top:4px}
.stat-card .sc-accent{position:absolute;right:14px;top:14px;font-size:22px;opacity:.3}
/* ALERT SYSTEM */
.alerts-panel{margin-bottom:20px}
.alert-group{margin-bottom:10px}
.alert-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.alert-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:5px;display:flex;align-items:center;gap:10px;font-size:12px;cursor:pointer;transition:.15s}
.alert-item:hover{background:var(--bg3)}
.alert-badge{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.p1 .alert-badge{background:var(--red)}
.p2 .alert-badge{background:var(--orange)}
.p3 .alert-badge{background:var(--yellow)}
.p4 .alert-badge{background:var(--blue)}
.p1 .alert-group-title{color:var(--red)}
.p2 .alert-group-title{color:var(--orange)}
.p3 .alert-group-title{color:var(--yellow)}
.p4 .alert-group-title{color:var(--blue)}
/* PIPELINE */
.pipeline-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.pipeline-scroll::-webkit-scrollbar{height:5px}
.pipeline-scroll::-webkit-scrollbar-track{background:var(--bg2)}
.pipeline-scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.pipe-col{min-width:200px;width:200px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);display:flex;flex-direction:column}
.pipe-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.pipe-header h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pipe-count{font-size:11px;background:var(--bg4);padding:2px 8px;border-radius:20px;color:var(--text2)}
.pipe-cards{padding:8px;flex:1;min-height:80px}
.kanban-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:.15s;position:relative}
.kanban-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.kanban-card .kc-name{font-size:13px;font-weight:600;margin-bottom:4px}
.kanban-card .kc-meta{font-size:11px;color:var(--text2)}
.kanban-card .kc-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.kanban-card .kc-alert{position:absolute;top:6px;right:6px;font-size:10px}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-yellow{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--blue)}
.badge-orange{background:rgba(249,115,22,.15);color:var(--orange)}
.badge-purple{background:rgba(108,99,255,.15);color:var(--accent2)}
.badge-gray{background:rgba(100,116,139,.15);color:var(--text3)}
/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--bg2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:none}
.td-name{font-weight:600;cursor:pointer;color:var(--accent2)}.td-name:hover{text-decoration:underline}
/* FORMS */
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--bg4)}
textarea{resize:vertical;min-height:70px}
select option{background:var(--bg3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.checkbox-group{display:flex;gap:14px;flex-wrap:wrap}
.checkbox-item{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.checkbox-item input{width:auto}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:860px;margin:auto}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--bg3);color:var(--text)}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
/* TABS */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:9px 16px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.tab-panel{display:none}.tab-panel.active{display:block}
/* STATUS INDICATORS */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.status-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.status-box label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block}
.status-indicator{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}
.dot-yellow{background:var(--yellow)}
.dot-red{background:var(--red)}
.dot-gray{background:var(--text3)}
.dot-blue{background:var(--blue)}
/* QUICK PASTE */
.qp-area{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.qp-area textarea{background:var(--bg4);min-height:120px}
.qp-result{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px}
.qp-field{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:12px}
.qp-field .qf-label{color:var(--text3);min-width:130px;padding-top:1px}
.qp-field .qf-value{color:var(--text);font-weight:500}
.qp-field .qf-value.found{color:var(--green)}
.qp-field .qf-value.notfound{color:var(--text3);font-style:italic}
/* HISTORIAL */
.hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.hist-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center;padding-top:1px}
.hist-content{flex:1}
.hist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hist-title{font-size:13px;font-weight:600}
.hist-date{font-size:11px;color:var(--text3)}
.hist-body{font-size:12px;color:var(--text2)}
.hist-client{font-size:11px;color:var(--accent2);cursor:pointer;margin-top:2px}
/* MODULE TAGS */
.mod-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600}
.mod1{background:rgba(59,130,246,.15);color:var(--blue)}
.mod2{background:rgba(236,72,153,.15);color:var(--pink)}
/* MONTO */
.monto-display{font-size:15px;font-weight:700;color:var(--green)}
.monto-alt{font-size:11px;color:var(--text3);margin-top:1px}
/* REPORTS */
.report-filter{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:5px}
.filter-group label{font-size:11px;color:var(--text2)}
.filter-group input,.filter-group select{width:auto;min-width:140px}
/* SOP */
.sop-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.sop-title{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--accent2)}
.sop-step{display:flex;gap:10px;margin-bottom:8px;font-size:13px}
.sop-num{width:22px;height:22px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
/* SEARCH */
.search-bar{display:flex;gap:10px;align-items:center;flex:1;min-width:200px}
.search-bar input{flex:1}
/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .es-icon{font-size:40px;margin-bottom:12px}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--text2)}
/* TOOLTIPS */
[title]{cursor:help}
/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
/* TAGS IN KANBAN */
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
/* DRAG & DROP */
.kanban-card[draggable]{cursor:grab}
.kanban-card.dragging{opacity:.4;transform:rotate(2deg)}
.pipe-cards.drag-over{background:rgba(108,99,255,.08);border:2px dashed var(--accent);border-radius:8px}
/* PRIORITY */
.prio-alta{color:var(--red)}.prio-media{color:var(--yellow)}.prio-baja{color:var(--green)}
/* REVENUE SUMMARY */
.rev-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;text-align:center}
.rev-box .rv-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.rev-box .rv-clp{font-size:18px;font-weight:700;color:var(--green)}
.rev-box .rv-uf{font-size:11px;color:var(--text2);margin-top:2px}
/* COLLAPSIBLE ALERTS */
.alert-toggle{background:none;border:none;color:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="logo">
      <h2>🍽️ AyHungry</h2>
    </div>
    <nav id="nav"></nav>
  </div>
  <div id="main">
    <div id="view-root"></div>
  </div>
</div>

<!-- MODAL FICHA -->
<div id="modal-ficha" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h3 id="modal-title">Ficha Cliente</h3>
        <div id="modal-sub" style="font-size:12px;color:var(--text3);margin-top:3px"></div>
      </div>
      <button class="modal-close" onclick="closeFicha()">✕</button>
    </div>
    <div class="modal-body">
      <div class="tabs" id="ficha-tabs">
        <div class="tab active" onclick="switchTab(0)" data-tab="0">📋 Info General</div>
        <div class="tab" onclick="switchTab(1)" data-tab="1">🗺️ Ficha Google</div>
        <div class="tab" onclick="switchTab(2)" data-tab="2">⏱️ Prueba / Pago</div>
        <div class="tab" onclick="switchTab(3)" data-tab="3">🧾 Facturación</div>
        <div class="tab" onclick="switchTab(4)" data-tab="4">📞 Historial</div>
      </div>
      <div id="tab-0" class="tab-panel active"></div>
      <div id="tab-1" class="tab-panel"></div>
      <div id="tab-2" class="tab-panel"></div>
      <div id="tab-3" class="tab-panel"></div>
      <div id="tab-4" class="tab-panel"></div>
    </div>
    <div class="modal-footer" style="justify-content:space-between">
      <button class="btn btn-danger btn-sm" onclick="confirmDeleteCliente()">🗑️ Eliminar cliente</button>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary btn-sm" onclick="closeFicha()">Cerrar</button>
        <button class="btn btn-primary btn-sm" onclick="saveCliente()">💾 Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL INTERACCION -->
<div id="modal-inter" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:580px">
    <div class="modal-header">
      <h3 id="inter-modal-title">➕ Registrar Interacción</h3>
      <button class="modal-close" onclick="closeInter()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Tipo</label>
          <select id="i-tipo" onchange="toggleReunionFields()">
            <option value="llamada">📞 Llamada</option>
            <option value="demo">🎯 Demo</option>
            <option value="propuesta">📄 Propuesta Enviada</option>
            <option value="whatsapp">💬 WhatsApp</option>
            <option value="email">✉️ Email</option>
            <option value="reunion">📅 Reunión</option>
            <option value="nota">📝 Nota interna</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha y hora</label>
          <input type="datetime-local" id="i-fecha">
        </div>
      </div>
      <!-- Campos extra para reunión -->
      <div id="reunion-fields" style="display:none;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:600;color:var(--accent2);margin-bottom:8px">📅 Detalles de Reunión</div>
        <div class="form-row">
          <div class="form-group">
            <label>Título de la reunión</label>
            <input type="text" id="i-reunion-titulo" placeholder="Ej: Demo AyHungry — El Mesón">
          </div>
          <div class="form-group">
            <label>Duración (minutos)</label>
            <select id="i-reunion-duracion">
              <option value="30">30 min</option>
              <option value="60" selected>1 hora</option>
              <option value="90">1.5 horas</option>
              <option value="120">2 horas</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Lugar / Link videollamada</label>
          <input type="text" id="i-reunion-lugar" placeholder="Ej: Meet, Zoom, dirección física...">
        </div>
        <button class="btn btn-secondary btn-sm" onclick="abrirGoogleCalendar()" style="margin-top:4px">
          📅 Agregar a Google Calendar
        </button>
      </div>
      <div class="form-group">
        <label>Descripción / Notas</label>
        <textarea id="i-nota" rows="3" placeholder="Qué se habló, compromisos, próximos pasos..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tarea de seguimiento (opcional)</label>
          <input type="text" id="i-tarea" placeholder="Ej: Enviar propuesta el lunes">
        </div>
        <div class="form-group">
          <label>Fecha tarea</label>
          <input type="date" id="i-tarea-fecha">
        </div>
      </div>
      <!-- Adjuntar archivo -->
      <div class="form-group">
        <label>Adjuntar archivo (PDF, Excel, imagen, etc.)</label>
        <input type="file" id="i-archivo" accept=".pdf,.xlsx,.xls,.csv,.doc,.docx,.png,.jpg,.jpeg,.txt"
          onchange="previewArchivo(this)"
          style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px;font-size:12px;cursor:pointer">
        <div id="i-archivo-preview" style="display:none;margin-top:6px;font-size:12px;background:var(--bg3);padding:8px 12px;border-radius:6px;display:flex;align-items:center;gap:8px">
          <span id="i-archivo-nombre" style="color:var(--accent2)"></span>
          <span id="i-archivo-size" style="color:var(--text3)"></span>
          <button class="btn btn-xs btn-danger" onclick="clearArchivo()" style="margin-left:auto">✕</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" onclick="closeInter()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="saveInteraccion()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL NUEVO CLIENTE RAPIDO -->
<div id="modal-nuevo" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3>➕ Nuevo Cliente</h3>
      <button class="modal-close" onclick="document.getElementById('modal-nuevo').style.display='none'">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Nombre del restaurante *</label><input type="text" id="nc-nombre" placeholder="El Mesón Chileno"></div>
        <div class="form-group"><label>Contacto</label><input type="text" id="nc-contacto" placeholder="Nombre del dueño/encargado"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Teléfono / WhatsApp</label><input type="text" id="nc-tel" placeholder="+56 9 1234 5678"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS & CONFIG
// ═══════════════════════════════════════════════════════════
const UF_RATE = 38500; // ~CLP por UF
const STORAGE_KEY = 'ayhungry_seo_crm_v3';

// ═══════════════════════════════════════════════════════════
// BACKUP LAYER — IndexedDB (redundante) + File System API
// ═══════════════════════════════════════════════════════════
const IDB_NAME = 'AyHungryCRM_v1';
const IDB_SNAPSHOTS = 'snapshots';
const IDB_META = 'meta';
const IDB_DIR_KEY = 'backupDirHandle';
let _idb = null;
let _backupDirHandle = null;
let _lastFileBackup = null;
let _fileBackupTimer = null;

function openIDB(){
  return new Promise((resolve,reject)=>{
    if(_idb){resolve(_idb);return;}
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_SNAPSHOTS)) db.createObjectStore(IDB_SNAPSHOTS,{keyPath:'ts'});
      if(!db.objectStoreNames.contains(IDB_META)) db.createObjectStore(IDB_META);
    };
    req.onsuccess = e=>{ _idb=e.target.result; resolve(_idb); };
    req.onerror = ()=>reject(req.error);
  });
}

async function saveToIDB(json){
  try{
    const db=await openIDB();
    const tx=db.transaction(IDB_SNAPSHOTS,'readwrite');
    const store=tx.objectStore(IDB_SNAPSHOTS);
    store.put({ts:Date.now(),data:json});
    store.getAll().onsuccess=e=>{
      const all=e.target.result||[];
      if(all.length>50) all.sort((a,b)=>a.ts-b.ts).slice(0,all.length-50).forEach(item=>store.delete(item.ts));
    };
  }catch(e){console.warn('IDB save error',e);}
}

async function loadLatestFromIDB(){
  try{
    const db=await openIDB();
    return new Promise(resolve=>{
      const tx=db.transaction(IDB_SNAPSHOTS,'readonly');
      tx.objectStore(IDB_SNAPSHOTS).getAll().onsuccess=e=>{
        const all=e.target.result||[];
        if(!all.length){resolve(null);return;}
        all.sort((a,b)=>b.ts-a.ts);
        resolve(all[0].data);
      };
    });
  }catch(e){console.warn('IDB load error',e);return null;}
}

async function saveDirHandleToIDB(handle){
  try{
    const db=await openIDB();
    const tx=db.transaction(IDB_META,'readwrite');
    tx.objectStore(IDB_META).put(handle,IDB_DIR_KEY);
  }catch(e){console.warn('IDB dirHandle save error',e);}
}

async function loadDirHandleFromIDB(){
  try{
    const db=await openIDB();
    return new Promise(resolve=>{
      const tx=db.transaction(IDB_META,'readonly');
      const req=tx.objectStore(IDB_META).get(IDB_DIR_KEY);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>resolve(null);
    });
  }catch(e){return null;}
}

async function setupAutoBackup(){
  if(!window.showDirectoryPicker){
    showToast('⚠️ Tu versión de Chrome no soporta backup automático a carpeta','error');
    return;
  }
  try{
    const dirHandle=await window.showDirectoryPicker({id:'ayhungry-backup',mode:'readwrite',startIn:'documents'});
    _backupDirHandle=dirHandle;
    await saveDirHandleToIDB(dirHandle);
    await writeFileBackup();
    showToast('✅ Backup automático configurado — se guarda en cada cambio');
    updateBackupStatus();
  }catch(e){
    if(e.name!=='AbortError') showToast('No se pudo configurar: '+e.message,'error');
  }
}

async function writeFileBackup(){
  if(!_backupDirHandle) return;
  try{
    const perm=await _backupDirHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){_backupDirHandle=null;updateBackupStatus();return;}
    // Nunca guardar si DB está vacío (protege contra sobrescribir con estado malo)
    if(!DB.clientes || DB.clientes.length === 0){
      console.warn('writeFileBackup abortado — DB sin clientes');
      return;
    }
    // Proteger contra sobrescribir con un dataset que tenga >30% menos clientes
    if(!window._lastSafeClientCount) window._lastSafeClientCount = DB.clientes.length;
    const minSafe = Math.max(5, Math.floor(window._lastSafeClientCount * 0.7));
    if(DB.clientes.length < minSafe){
      console.warn('writeFileBackup abortado — DB tiene ' + DB.clientes.length + ' clientes, mínimo seguro: ' + minSafe);
      return;
    }
    window._lastSafeClientCount = DB.clientes.length;
    const json=JSON.stringify(DB);
    // Archivo principal para recuperación automática (el agente programado lo usa)
    const ch=await _backupDirHandle.getFileHandle('crm_data.json',{create:true});
    const cw=await ch.createWritable(); await cw.write(json); await cw.close();
    // Archivo latest (siempre sobreescribe)
    const lh=await _backupDirHandle.getFileHandle('AyHungry_CRM_latest.json',{create:true});
    const lw=await lh.createWritable(); await lw.write(json); await lw.close();
    // Archivo diario (un archivo por día)
    const today=new Date().toISOString().slice(0,10);
    const dh=await _backupDirHandle.getFileHandle(`AyHungry_CRM_${today}.json`,{create:true});
    const dw=await dh.createWritable(); await dw.write(json); await dw.close();
    _lastFileBackup=new Date();
    updateBackupStatus();
  }catch(e){
    console.warn('File backup error',e);
    if(e.name==='NotAllowedError'){_backupDirHandle=null;updateBackupStatus();}
  }
}

function scheduleFileBackup(){
  clearTimeout(_fileBackupTimer);
  _fileBackupTimer=setTimeout(()=>writeFileBackup(),2000);
}

function updateBackupStatus(){
  const el=document.getElementById('backupAutoStatus');
  if(!el) return;
  if(_backupDirHandle){
    const t=_lastFileBackup?_lastFileBackup.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'ahora';
    el.innerHTML=`<span style="color:var(--green)">✅ Activo — último guardado: ${t}</span>
      <button class="btn" style="margin-left:12px;padding:4px 10px;font-size:12px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)" onclick="setupAutoBackup()">Cambiar carpeta</button>`;
  }else if(window._needsFileReconnect){
    el.innerHTML=`<span style="color:var(--yellow)">⚠️ Hay backup en carpeta — </span>
      <button class="btn" style="background:#f97316;color:#fff;padding:4px 12px;font-size:12px;border:none;cursor:pointer" onclick="reconnectFromFile()">Reconectar y restaurar</button>`;
  }else{
    el.innerHTML=`<span style="color:var(--yellow)">⚠️ Sin carpeta configurada — tus datos solo están en el navegador</span>
      <button class="btn btn-primary" style="margin-left:12px;padding:4px 10px;font-size:12px" onclick="setupAutoBackup()">Configurar carpeta</button>`;
  }
}

async function initBackupSystem(){
  const handle=await loadDirHandleFromIDB();
  if(handle){_backupDirHandle=handle;scheduleFileBackup();}
  updateBackupStatus();
}

async function reconnectFromFile(){
  try{
    const handle=_backupDirHandle||await loadDirHandleFromIDB();
    if(!handle){ showToast('No hay carpeta configurada','error'); return; }
    const perm=await handle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ showToast('Permiso denegado','error'); return; }
    _backupDirHandle=handle;
    const fh=await handle.getFileHandle('AyHungry_CRM_latest.json').catch(()=>null);
    if(!fh){ showToast('Archivo JSON no encontrado en la carpeta','error'); return; }
    const txt=await (await fh.getFile()).text();
    const parsed=JSON.parse(txt);
    if(!parsed.clientes||parsed.clientes.length===0){ showToast('Archivo JSON vacío','error'); return; }
    DB=Object.assign({clientes:[],interacciones:[],nextId:1,nextIId:1,lastView:'dashboard'},parsed);
    saveDB();
    const banner=document.getElementById('reconnect-banner');
    if(banner) banner.remove();
    buildNav(); showView(DB.lastView||'dashboard');
    showToast('✅ '+DB.clientes.length+' clientes restaurados desde JSON');
  }catch(e){ showToast('Error al leer JSON: '+e.message,'error'); }
}

function showReconnectBanner(){
  if(document.getElementById('reconnect-banner')) return;
  const bar=document.createElement('div');
  bar.id='reconnect-banner';
  bar.style='position:fixed;top:0;left:0;right:0;background:#f97316;color:#fff;padding:10px 20px;z-index:9999;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600';
  bar.innerHTML='⚠️ Hay un backup en carpeta — <button onclick="reconnectFromFile()" style="background:#fff;color:#f97316;border:none;border-radius:4px;padding:4px 12px;cursor:pointer;font-weight:700">Restaurar ahora</button> <span style="font-weight:400">(Un click para cargar tus últimos datos)</span>';

}

let DB = {clientes:[], interacciones:[], nextId:1, nextIId:1, lastView:'dashboard'};

function saveDB(){
  try{
    DB.lastView = currentView||'dashboard';
    const json = JSON.stringify(DB);
    localStorage.setItem(STORAGE_KEY, json); // siempre primero localStorage
    try{ saveToIDB(json); }catch(e){} // backup IDB — error silencioso, no rompe nada
    try{ if(_backupDirHandle) scheduleFileBackup(); }catch(e){} // backup archivo — error silencioso
  }catch(e){
    console.error('[saveDB] Error al guardar:', new Date().toISOString(), e);
    const isQuota = e.name === 'QuotaExceededError' || (e.message && e.message.toLowerCase().includes('quota'));
    if(isQuota){
      // Mostrar banner persistente de almacenamiento lleno
      let banner = document.getElementById('quota-banner');
      if(!banner){
        banner = document.createElement('div');
        banner.id = 'quota-banner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;padding:12px 20px;z-index:10000;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.4)';
        banner.innerHTML = '⚠️ Error al guardar: almacenamiento lleno. Exporta tus datos ahora. <button onclick="exportarDatos()" style="background:#fff;color:#ef4444;border:none;border-radius:4px;padding:4px 12px;cursor:pointer;font-weight:700;margin-left:8px">Exportar ahora</button><button onclick="this.parentElement.remove()" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:4px 10px;cursor:pointer;margin-left:4px">✕</button>';
        document.body.prepend(banner);
      }
      // Intentar guardar en IDB como fallback
      try{ const json = JSON.stringify(DB); saveToIDB(json); }catch(idbErr){ console.error('[saveDB] IDB fallback también falló:', idbErr); }
    } else {
      showToast('⚠️ Error al guardar datos: ' + e.message, 'error');
    }
  }
}

let draggedClienteId = null;
function dragStart(e, id){
  draggedClienteId = id;

}
function dragEnd(e){
  e.currentTarget.classList.remove('dragging');

  document.querySelectorAll('.pipe-cards').forEach(el=>el.classList.remove('drag-over'));
}
function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function dragLeave(e){
  // Only remove if leaving the column (not entering a child)
  if(!e.currentTarget.contains(e.relatedTarget)){

  }
}
function dropCard(e, nuevoEstado){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!draggedClienteId) return;
  const c = DB.clientes.find(x=>x.id===draggedClienteId);
  if(c && c.estado !== nuevoEstado){
    if(nuevoEstado==='validacion_bot' && (!c.modulos || c.modulos.length===0)){
      showToast('⚠️ Validación Técnica requiere al menos un módulo activo','error');

    c.estado = nuevoEstado;

    showToast(`✅ Movido a ${label}`);

  }
  draggedClienteId = null;
}

// Helper: clientes activos (excluye soft-deleted)
function activeClientes(){ return DB.clientes.filter(c=>!c.deleted); }

// Currency helpers
function toCLP(c){ return c.monedaTipo==='UF' ? (parseFloat(c.monto)||0)*UF_RATE : (parseFloat(c.monto)||0); }
function toUF(c){  return c.monedaTipo==='CLP' ? (parseFloat(c.monto)||0)/UF_RATE : (parseFloat(c.monto)||0); }
function fmtCLP(n){ return 'CLP '+Math.round(n).toLocaleString('es-CL'); }
function fmtUF(n){  return 'UF '+n.toFixed(2); }
function fmtMonto(c){
  if(!c.monto) return '—';
  if(c.monedaTipo==='CLP') return fmtCLP(parseFloat(c.monto)||0);
  return fmtUF(parseFloat(c.monto)||0);
}
function fmtMontoAlt(c){
  if(!c.monto) return '';
  if(c.monedaTipo==='CLP') return '≈ '+fmtUF(toUF(c));
  return '≈ '+fmtCLP(toCLP(c));
}

// Date helpers
function today(){ return new Date().toISOString().split('T')[0]; }
function diffDays(a,b){
  const d1=new Date(a), d2=new Date(b||today());
  return Math.round((d2-d1)/(1000*60*60*24));
}
function fmtDate(d){ if(!d) return '—'; const p=d.split('T')[0]; const [y,m,dd]=p.split('-'); return `${dd}/${m}/${y}`; }
function fmtDatetime(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('es-CL')+' '+dt.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); }
function isOverdue(d){ return d && d < today(); }

// ═══════════════════════════════════════════════════════════
// ALERT ENGINE
// ═══════════════════════════════════════════════════════════
function buildAlerts(){
  const alerts = {p1:[],p2:[],p3:[],p4:[]};
  const t = today();

  // FIX 8: Índice O(n) — construir Map de última interacción y tareas vencidas por cliente
  const lastInteraccionMap = new Map();
  const tareasVencidasMap  = new Map();
  DB.interacciones.forEach(i=>{
    const prev = lastInteraccionMap.get(i.clienteId);
    if(!prev || i.fecha > prev.fecha) lastInteraccionMap.set(i.clienteId, i);
    if(i.tareaFecha && isOverdue(i.tareaFecha) && !i.tareaCompletada){
      if(!tareasVencidasMap.has(i.clienteId)) tareasVencidasMap.set(i.clienteId, []);
      tareasVencidasMap.get(i.clienteId).push(i);
    }
  });

  activeClientes().forEach(c=>{
    if(c.estado==='perdido') return;
    const lastContact = lastInteraccionMap.get(c.id);
    const diasSinContacto = lastContact ? diffDays(lastContact.fecha.split('T')[0], t) : (c.createdAt ? diffDays(c.createdAt.split('T')[0], t) : 999);
    const pruebaFin = c.pruebaFin;
    const diasHastaPrueba = pruebaFin ? diffDays(t, pruebaFin) : null;

    // P1: Critical — revisar cada local
    const locs = ensureLocales(c);
    const noMatchFicha = locs.filter(l=>l.fichaMatch==='no_match');
    if(noMatchFicha.length>0){
      const labels = noMatchFicha.map((l,i)=>l.nombre||`Local ${locs.indexOf(l)+1}`).join(', ');
      alerts.p1.push({id:c.id, text:`${c.nombre} — Ficha Google sin match: ${labels}`, icon:'❌'});
    }
    if(pruebaFin && isOverdue(pruebaFin) && c.estado==='periodo_prueba'){
      alerts.p1.push({id:c.id, text:`${c.nombre} — Prueba vencida (${fmtDate(pruebaFin)})`, icon:'⏰'});
    }
    if(diasHastaPrueba===0 && c.estado==='periodo_prueba'){
      alerts.p1.push({id:c.id, text:`${c.nombre} — Prueba VENCE HOY`, icon:'🚨'});
    }

    // P2: Urgent
    if(diasSinContacto>=10 && ['contactado','acuerdo_alcanzado','periodo_prueba','pago_directo'].includes(c.estado)){
      alerts.p2.push({id:c.id, text:`${c.nombre} — Sin contacto hace ${diasSinContacto} días`, icon:'📵'});
    }
    const noMatchBoton = locs.filter(l=>l.botonReserva==='no_match');
    if(c.modulos.includes('modulo1') && noMatchBoton.length>0 && c.estado==='cliente_activo'){
      const labels = noMatchBoton.map(l=>l.nombre||`Local ${locs.indexOf(l)+1}`).join(', ');
      alerts.p2.push({id:c.id, text:`${c.nombre} — Botón Reservar Mesa sin match: ${labels}`, icon:'📍'});
    }
    // Tareas vencidas (usando índice pre-construido)
    (tareasVencidasMap.get(c.id)||[]).forEach(i=>{
      alerts.p2.push({id:c.id, text:`${c.nombre} — Tarea vencida: ${i.tarea||'sin título'}`, icon:'✅'});
    });

    // P3: Important
    if(c.estado==='cliente_activo' && (!c.rut || !c.nombreFiscal)){
      alerts.p3.push({id:c.id, text:`${c.nombre} — Facturación incompleta`, icon:'🧾'});
    }
    if(diasHastaPrueba!==null && diasHastaPrueba>=1 && diasHastaPrueba<=7 && c.estado==='periodo_prueba'){
      alerts.p3.push({id:c.id, text:`${c.nombre} — Prueba vence en ${diasHastaPrueba} días (${fmtDate(pruebaFin)})`, icon:'⏳'});
    }

    // P3+: Datos incompletos en clientes activos
    if(['cliente_activo','pago_directo'].includes(c.estado)){
      const faltantes = [];
      if(!c.rut)     faltantes.push('RUT');
      if(!c.monto)   faltantes.push('monto');
      if(!c.fechaIni) faltantes.push('fecha de inicio');
      if(faltantes.length > 0){
        alerts.p3.push({id:c.id, text:`${c.nombre} — Datos incompletos: ${faltantes.join(', ')}`, icon:'📋'});
      }
    }

    // P4: Info
    if(diasSinContacto>=1 && diasSinContacto<3 && c.estado==='nuevo_lead'){
      alerts.p4.push({id:c.id, text:`${c.nombre} — Lead nuevo sin contacto en ${diasSinContacto}d`, icon:'💤'});
    }
    if(c.estado==='cliente_activo' && diasSinContacto>=14){
      alerts.p4.push({id:c.id, text:`${c.nombre} — Cliente sin check-in hace ${diasSinContacto} días`, icon:'👋'});
    }
  });

  return alerts;
}

// ═══════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════
let currentView = 'dashboard';

function buildNav(){
  const nav = document.getElementById('nav');
  const clientesActivosIds = new Set(activeClientes().map(c=>c.id));
  const tareasPendientes = DB.interacciones.filter(i=>i.tarea&&!i.tareaCompletada&&clientesActivosIds.has(i.clienteId)).length;
  const tareasVencidas   = DB.interacciones.filter(i=>i.tarea&&!i.tareaCompletada&&i.tareaFecha&&isOverdue(i.tareaFecha)&&clientesActivosIds.has(i.clienteId)).length;
  nav.innerHTML = NAV_ITEMS.map(n=>{
    if(n.id==='sep') return '<div style="height:1px;background:var(--border);margin:6px 0"></div>';
    let badge = '';
    if(n.id==='tareas' && tareasPendientes>0){
      const color = tareasVencidas>0 ? 'var(--red)' : 'var(--yellow)';
      badge = `<span style="background:${color};color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:auto;font-weight:700">${tareasPendientes}</span>`;
    }
    return `<div class="nav-item ${n.id===currentView?'active':''}" onclick="showView('${n.id}')" style="justify-content:flex-start">
      <span class="icon">${n.icon}</span><span style="flex:1">${n.label}</span>${badge}
    </div>`;
  }).join('');
}

function showView(v){
  currentView = v;
  buildNav();
  const root = document.getElementById('view-root');
  switch(v){
    case 'mi_dia':     root.innerHTML = renderMiDia(); break;
    case 'dashboard':  root.innerHTML = renderDashboard(); break;
    case 'kanban':     root.innerHTML = renderKanban(); break;
    case 'clientes':   root.innerHTML = renderClientes(); break;
    case 'historial':  root.innerHTML = renderHistorial(); break;
    case 'tareas':     root.innerHTML = renderTareas(); break;
    case 'quickpaste': root.innerHTML = renderQuickPaste(); break;
    case 'reportes':   root.innerHTML = renderReportes(); break;
    case 'reporte_semanal': root.innerHTML = renderReporteSemanal(); break;
    case 'sop':        root.innerHTML = renderSOP(); break;
    case 'datos':      root.innerHTML = renderDatos(); break;
    default:           root.innerHTML = '<div class="page"><p>Vista no encontrada</p></div>';
  }
}

// ═══════════════════════════════════════════════════════════
// MI DÍA
// ═══════════════════════════════════════════════════════════
function renderMiDia(){
  const t = today();
  const alerts = buildAlerts();
  const totalAlerts = alerts.p1.length + alerts.p2.length + alerts.p3.length + alerts.p4.length;

  // Seguimientos vencidos o para hoy
  const seguimientos = activeClientes().filter(c=>{
    return c.fechaProx && c.fechaProx.split('T')[0] <= t && c.estado !== 'perdido';
  }).sort((a,b)=>a.fechaProx.localeCompare(b.fechaProx));

  // Últimas 3 interacciones
  const ultimasInter = [...DB.interacciones]
    .sort((a,b)=>b.fecha.localeCompare(a.fecha))
    .slice(0,3);

  // Conteo por etapa (clientes activos)
  const etapas = {};
  PIPELINE.forEach(p=>{ etapas[p.id] = {label:p.label, color:p.color, count:0}; });
  activeClientes().forEach(c=>{ if(etapas[c.estado]) etapas[c.estado].count++; });

  // ── Alertas críticas ──
  let alertasHtml = '';
  if(totalAlerts === 0){
    alertasHtml = '<div style="color:var(--green);font-size:13px;padding:10px 0">✅ Sin alertas activas</div>';
  } else {
    const allAlerts = [
      ...alerts.p1.map(a=>({...a,prio:'p1',icon:'🔴'})),
      ...alerts.p2.map(a=>({...a,prio:'p2',icon:'🟠'})),
      ...alerts.p3.map(a=>({...a,prio:'p3',icon:'🟡'})),
    ].slice(0,8);
    alertasHtml = allAlerts.map(a=>`
      <div class="alert-item ${a.prio}" onclick="openFicha(${a.id})" style="margin-bottom:4px">
        <div class="alert-badge"></div>
        <span>${a.icon} ${a.text}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--text3)">→</span>
      </div>`).join('');
  }

  // ── Seguimientos hoy/vencidos ──
  let seguHtml = seguimientos.length === 0
    ? '<div style="color:var(--text3);font-size:13px;padding:8px 0">Sin seguimientos para hoy 👍</div>'
    : seguimientos.map(c=>{
        const vencido = c.fechaProx.split('T')[0] < t;
        return `<div class="alert-item" onclick="openFicha(${c.id})" style="margin-bottom:4px;border-left:3px solid ${vencido?'var(--red)':'var(--accent)'}">
          <span style="font-size:13px">${vencido?'⏰':'📅'}</span>
          <span><strong>${esc(c.nombre)}</strong> — ${esc(c.proxima||'Seguimiento')}</span>
          <span style="margin-left:auto;font-size:11px;color:var(--text3)">${fmtDate(c.fechaProx)}</span>
        </div>`;
      }).join('');

  // ── Últimas interacciones ──
  let interHtml = ultimasInter.length === 0
    ? '<div style="color:var(--text3);font-size:13px;padding:8px 0">Sin interacciones registradas</div>'
    : ultimasInter.map(i=>{
        const c = DB.clientes.find(x=>x.id===i.clienteId);
        return `<div style="padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="${c?'openFicha('+c.id+')':''}">
          <span style="font-size:12px;color:var(--text3)">${fmtDatetime(i.fecha)}</span>
          <div style="font-size:13px;margin-top:2px">${TIPO_LABELS[i.tipo]||i.tipo} — <strong>${esc(c?c.nombre:'?')}</strong>${i.nota?' — <span style="color:var(--text2)">'+esc(i.nota.slice(0,60))+'</span>':''}</div>
        </div>`;
      }).join('');

  // ── Conteo por etapa ──
  const etapaItems = PIPELINE.map(p=>{
    const n = etapas[p.id]?.count||0;
    if(n===0) return '';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0">
      <span style="font-size:12px;color:${p.color}">●</span>
      <span style="flex:1;margin-left:8px;font-size:12px">${p.label}</span>
      <span style="font-size:13px;font-weight:700">${n}</span>
    </div>`;
  }).join('');

  const now = new Date();
  const hora = now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  const fecha = now.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

  return `<div class="page">
    <div class="page-header">
      <div>
        <div class="page-title">☀️ Mi Día</div>
        <div class="page-subtitle">${fecha} — ${hora}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <!-- Alertas activas -->
      <div class="card">
        <div class="card-title">🚨 Alertas (${totalAlerts})</div>
        ${alertasHtml}
        ${totalAlerts>8?`<div style="font-size:11px;color:var(--text3);margin-top:6px">+${totalAlerts-8} más — ver Dashboard</div>`:''}
      </div>

      <!-- Seguimientos hoy/vencidos -->
      <div class="card">
        <div class="card-title">📅 Seguimientos hoy / vencidos (${seguimientos.length})</div>
        ${seguHtml}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px">
      <!-- Últimas interacciones -->
      <div class="card">
        <div class="card-title">📞 Últimas 3 interacciones</div>
        ${interHtml}
      </div>

      <!-- Pipeline compacto -->
      <div class="card">
        <div class="card-title">📊 Clientes por etapa</div>
        ${etapaItems||'<span style="color:var(--text3);font-size:13px">Sin datos</span>'}
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)">
          Total activos: <strong>${activeClientes().filter(c=>c.estado!=='perdido').length}</strong>
        </div>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════
function renderDashboard(){
  const activos   = activeClientes().filter(c=>c.estado==='cliente_activo');
  const prueba    = activeClientes().filter(c=>['periodo_prueba','pago_directo'].includes(c.estado));
  const pipeline  = activeClientes().filter(c=>!['cliente_activo','perdido'].includes(c.estado));
  const perdidos  = activeClientes().filter(c=>c.estado==='perdido');
  const totalCLP  = activos.reduce((s,c)=>s+toCLP(c),0);
  const totalUF   = activos.reduce((s,c)=>s+toUF(c),0);
  const pipeCLP   = pipeline.reduce((s,c)=>s+toCLP(c),0);
  const pipeUF    = pipeline.reduce((s,c)=>s+toUF(c),0);
  const alerts    = buildAlerts();
  const totalAlerts = alerts.p1.length+alerts.p2.length+alerts.p3.length+alerts.p4.length;

  let alertsHTML = '';
  if(totalAlerts===0){
    alertsHTML = '<div class="card" style="text-align:center;padding:20px;color:var(--green)">✅ Sin alertas activas — Todo bajo control</div>';
  } else {
    const groups = [
      {key:'p1', label:'P1 CRÍTICO', count:alerts.p1.length},
      {key:'p2', label:'P2 URGENTE', count:alerts.p2.length},
      {key:'p3', label:'P3 IMPORTANTE', count:alerts.p3.length},
      {key:'p4', label:'P4 INFO', count:alerts.p4.length},
    ];
    alertsHTML = '<div class="alerts-panel">' + groups.map(g=>{
      if(!alerts[g.key].length) return '';
      const items = alerts[g.key].map(a=>`
        <div class="alert-item ${g.key}" onclick="openFicha(${a.id})">
          <div class="alert-badge"></div>
          <span style="font-size:14px">${a.icon}</span>
          <span>${a.text}</span>
          <span style="margin-left:auto;font-size:10px;color:var(--text3)">→ Ver ficha</span>
        </div>`).join('');
      return `<div class="alert-group ${g.key}">
        <div class="alert-group-title">${g.label} <span style="background:var(--bg3);padding:1px 7px;border-radius:10px;font-size:10px;opacity:.8">${g.count}</span></div>
        ${items}
      </div>`;
    }).join('') + '</div>';
  }

  // Pipeline distribution
  const pipeBar = PIPELINE.filter(p=>p.id!=='perdido').map(p=>{
    const count = DB.clientes.filter(c=>c.estado===p.id).length;
    const pct = DB.clientes.length ? Math.round(count/DB.clientes.length*100) : 0;
    if(!count) return '';
    return `<div style="margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span style="color:${p.color}">${p.label}</span><span style="color:var(--text3)">${count}</span>
      </div>
      <div style="background:var(--bg4);border-radius:3px;height:5px">
        <div style="width:${pct}%;background:${p.color};height:5px;border-radius:3px"></div>
      </div>
    </div>`;
  }).join('');

  return `<div class="page">
    <div class="page-header">
      <div><div class="page-title">Dashboard</div><div class="page-subtitle">${new Date().toLocaleDateString('es-CL',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div></div>
      <button class="btn btn-primary" onclick="document.getElementById('modal-nuevo').style.display='flex'">➕ Nuevo Cliente</button>
    </div>

    ${totalAlerts>0?`<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px">🔔 Alertas <span style="background:var(--red);color:#fff;padding:1px 7px;border-radius:10px;font-size:11px">${totalAlerts}</span></div>${alertsHTML}</div>`:''}

    <div class="grid-4" style="margin-bottom:20px">
      <div class="stat-card">
        <div class="sc-label">Clientes Activos</div>
        <div class="sc-value" style="color:var(--green)">${activos.length}</div>
        <div class="sc-sub">Pagando mensualmente</div>
        <div class="sc-accent">✅</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">En Prueba / Pago Directo</div>
        <div class="sc-value" style="color:var(--yellow)">${prueba.length}</div>
        <div class="sc-sub">Período de evaluación</div>
        <div class="sc-accent">⏱️</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Pipeline Total</div>
        <div class="sc-value" style="color:var(--blue)">${pipeline.length}</div>
        <div class="sc-sub">Leads en proceso</div>
        <div class="sc-accent">🔄</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Perdidos</div>
        <div class="sc-value" style="color:var(--red)">${perdidos.length}</div>
        <div class="sc-sub">Descartados</div>
        <div class="sc-accent">❌</div>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:20px">
      <div class="card">
        <div class="card-title">💰 Revenue Mensual Recurrente</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div class="rev-box">
            <div class="rv-label">Total CLP</div>
            <div class="rv-clp">${fmtCLP(totalCLP)}</div>
            <div class="rv-uf">≈ ${fmtUF(totalUF)}</div>
          </div>
          <div class="rev-box">
            <div class="rv-label">Total UF</div>
            <div class="rv-clp" style="color:var(--blue)">${fmtUF(totalUF)}</div>
            <div class="rv-uf">≈ ${fmtCLP(totalCLP)}</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text3)">Tasa de conversión: 1 UF = ${UF_RATE.toLocaleString('es-CL')} CLP</div>
      </div>
      <div class="card">
        <div class="card-title">📊 Pipeline Potencial</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div class="rev-box">
            <div class="rv-label">Potencial CLP</div>
            <div class="rv-clp" style="color:var(--orange)">${fmtCLP(pipeCLP)}</div>
            <div class="rv-uf">≈ ${fmtUF(pipeUF)}</div>
          </div>
          <div class="rev-box">
            <div class="rv-label">Potencial UF</div>
            <div class="rv-clp" style="color:var(--orange)">${fmtUF(pipeUF)}</div>
            <div class="rv-uf">≈ ${fmtCLP(pipeCLP)}</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text3)">${pipeline.length} clientes con monto definido en pipeline</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">📋 Distribución Pipeline</div>
        ${pipeBar || '<div style="color:var(--text3);font-size:13px">Sin clientes registrados</div>'}
      </div>
      <div class="card">
        <div class="card-title">🔔 Actividad Reciente</div>
        ${DB.interacciones.slice(-6).reverse().map(i=>{
          const c = DB.clientes.find(x=>x.id===i.clienteId);
          return `<div style="display:flex;gap:8px;margin-bottom:8px;font-size:12px">
            <span>${TIPO_LABELS[i.tipo]?.split(' ')[0]||'📝'}</span>
            <div><div style="font-weight:600;cursor:pointer;color:var(--accent2)" onclick="openFicha(${i.clienteId})">${c?c.nombre:'?'}</div>
            <div style="color:var(--text3)">${fmtDatetime(i.fecha)} — ${(i.nota||'').substring(0,60)}...</div></div>
          </div>`;
        }).join('') || '<div style="color:var(--text3);font-size:13px">Sin interacciones registradas</div>'}
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// KANBAN
// ═══════════════════════════════════════════════════════════
function renderKanban(){
  const stages = PIPELINE.map(p=>{
    const clts = DB.clientes.filter(c=>c.estado===p.id);
    const cards = clts.map(c=>{
      const mods = c.modulos.map(m=>m==='modulo1'?'<span class="mod-tag mod1" style="font-size:9px">M1</span>':'<span class="mod-tag mod2" style="font-size:9px">M2</span>').join('');
      const alerts = buildAlerts();
      const hasAlert = [...alerts.p1,...alerts.p2].some(a=>a.id===c.id);
      const nLoc = c.cantidadLocales||1;
      return `<div class="kanban-card" draggable="true"
        ondragstart="dragStart(event,${c.id})"
        ondragend="dragEnd(event)"
        onclick="openFicha(${c.id})">
        ${hasAlert?'<div class="kc-alert">🔴</div>':''}
        <div class="kc-name">${c.nombre}</div>
        <div class="kc-meta">${c.contacto||'Sin contacto'}</div>
        <div class="kc-tags" style="margin-top:5px">
          ${mods}
          ${nLoc>1?`<span class="tag" style="background:rgba(59,130,246,.1);color:var(--blue)">📍${nLoc}</span>`:''}
          ${c.monto?`<span class="tag" style="background:rgba(34,197,94,.1);color:var(--green)">${fmtMonto(c)}</span>`:''}
          ${c.prioridad==='alta'?'<span class="tag badge-red">Alta</span>':''}
          ${['nuevo_lead','contactado','acuerdo_alcanzado','validacion_bot'].includes(c.estado)
            ? (c.iniciTipo==='pago_directo'
                ? '<span class="tag" style="background:rgba(234,179,8,.15);color:#ca8a04;font-size:9px">💳 Pago directo</span>'
                : '<span class="tag" style="background:rgba(249,115,22,.12);color:#c2410c;font-size:9px">⏱️ Piloto</span>')
            : ''}
        </div>
        <div style="display:flex;gap:8px;margin-top:6px;font-size:10px">
          <span title="Botón Reservar Mesa">${aggLocales(c,'botonReserva')}</span>
          <span style="color:var(--text3)">|</span>
          <span title="Ficha Match">${aggLocales(c,'fichaMatch')}</span>
        </div>
      </div>`;
    }).join('') || '<div style="font-size:11px;color:var(--text3);padding:4px">Sin clientes</div>';
    return `<div class="pipe-col">
      <div class="pipe-header" style="border-top:3px solid ${p.color}">
        <h4 style="color:${p.color}">${p.label}</h4>
        <span class="pipe-count">${clts.length}</span>
      </div>
      <div class="pipe-cards" data-estado="${p.id}"
        ondragover="dragOver(event)"
        ondragleave="dragLeave(event)"
        ondrop="dropCard(event,'${p.id}')">${cards}</div>
    </div>`;
  }).join('');

  return `<div class="page">
    <div class="page-header">
      <div><div class="page-title">Pipeline Kanban</div><div class="page-subtitle">${DB.clientes.length} clientes totales</div></div>
      <button class="btn btn-primary" onclick="document.getElementById('modal-nuevo').style.display='flex'">➕ Nuevo Cliente</button>
    </div>
    <div class="pipeline-scroll">${stages}</div>
  </div>`;
}

// CLIENTES TABLE
// ═══════════════════════════════════════════════════════════

  let clts = activeClientes();
  if(filter) clts = clts.filter(c=>
    c.nombre.toLowerCase().includes(filter.toLowerCase()) ||
    (c.contacto||'').toLowerCase().includes(filter.toLowerCase()) ||
    (c.email||'').toLowerCase().includes(filter.toLowerCase())
  );

  const rows = clts.map(c=>{
    const p    = PIPELINE.find(x=>x.id===c.estado)||{color:'#64748b',label:c.estado};
    const mods = c.modulos.map(m=>m==='modulo1'?'<span class="mod-tag mod1">M1</span>':'<span class="mod-tag mod2">M2</span>').join(' ');
    const nLoc = c.cantidadLocales||1;
    return `<tr>

function completarTarea(iid){
  const inter = DB.interacciones.find(i=>i.id===iid);
  if(inter){ inter.tareaCompletada=true; saveDB(); showView(currentView); }
}

function abrirCalTarea(iid){
  const inter = DB.interacciones.find(i=>i.id===iid);
  if(!inter||!inter.tareaFecha) return;
  const c = DB.clientes.find(x=>x.id===inter.clienteId);
  const nombre = c ? c.nombre : 'Cliente';
  const titulo = encodeURIComponent(`📋 ${inter.tarea} — ${nombre}`);
  const desc = encodeURIComponent(`Tarea CRM AyHungry\nCliente: ${nombre}\n${inter.nota||''}`);
  // Fecha: YYYYMMDD (evento de día completo)
  const fecha = inter.tareaFecha.replace(/-/g,'');
  // Día siguiente para el fin del evento
  const dt = new Date(inter.tareaFecha);
  dt.setDate(dt.getDate()+1);
  const fechaFin = dt.toISOString().slice(0,10).replace(/-/g,'');
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titulo}&dates=${fecha}/${fechaFin}&details=${desc}`;
  window.open(url,'_blank');
}

let parsedData = {};

function parsePaste(){
  const text = document.getElementById('qp-input').value;
  if(!text.trim()) return;
  parsedData = extractFields(text);
  const fields = [
    {k:'nombre',     label:'Restaurante'},
    {k:'contacto',   label:'Contacto'},
    {k:'rut',        label:'RUT'},
    {k:'tel',        label:'Teléfono'},
    {k:'email',      label:'Email'},
    {k:'monto',      label:'Monto'},
    {k:'monedaTipo', label:'Moneda'},
    {k:'direccionFiscal', label:'Dirección'},
    {k:'nombreFiscal', label:'Razón Social'},
    {k:'correoFiscal', label:'Correo Fiscal'},
  ];
  const html = fields.map(f=>`
    <div class="qp-field">
      <span class="qf-label">${f.label}:</span>
      <span class="qf-value ${parsedData[f.k]?'found':'notfound'}">${parsedData[f.k]||'No detectado'}</span>
    </div>`).join('');
  document.getElementById('qp-fields').innerHTML = html;
  document.getElementById('qp-result').style.display = 'block';
}

function extractFields(text){
  const d = {};
  // RUT: XX.XXX.XXX-X or XXXXXXXX-X
  const rutMatch = text.match(/\b(\d{1,2}\.?\d{3}\.?\d{3}-[\dkK])\b/i);
  if(rutMatch) d.rut = formatRUT(rutMatch[1]);
  // Email
  const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[a-z]{2,}/i);
  if(emailMatch){ d.email = emailMatch[0]; d.correoFiscal = emailMatch[0]; }
  // Phone: +56 9 or 09 or 569
  const telMatch = text.match(/(\+56\s*9[\s\d]{8,}|0?9\d{8})/);
  if(telMatch) d.tel = telMatch[0].trim();
  // Monto UF first
  const ufMatch = text.match(/UF\s*(\d+[\.,]?\d*)/i);
  if(ufMatch){ d.monto = ufMatch[1].replace(',','.'); d.monedaTipo = 'UF'; }
  // Monto CLP
  if(!d.monto){
    const clpMatch = text.match(/\$\s*([\d.,]+)|(\d[\d.,]+)\s*(pesos|clp)/i);
    if(clpMatch){ d.monto = (clpMatch[1]||clpMatch[2]).replace(/\./g,'').replace(',','.'); d.monedaTipo = 'CLP'; }
  }
  // Dirección: Av., Calle, Pasaje, etc.
  const dirMatch = text.match(/(Av\.?|Avenida|Calle|Pasaje|Blvd\.?|Ruta)[^\n,]{3,50}/i);
  if(dirMatch) d.direccionFiscal = dirMatch[0].trim();
  // Email lines with "correo" or "factura"
  const correoMatch = text.match(/correo[^\n:]*:\s*([\w.+-]+@[\w-]+\.[a-z]{2,})/i);
  if(correoMatch) d.correoFiscal = correoMatch[1];
  // Nombre contacto: lines with "contacto:", "nombre:", "encargado:"
  const contactoMatch = text.match(/(contacto|nombre|encargado|dueño|propietario)\s*[:\-]\s*([^\n,;]{3,40})/i);
  if(contactoMatch) d.contacto = contactoMatch[2].trim();
  // Razón social or empresa
  const razonMatch = text.match(/(razón social|razón|empresa|sociedad)\s*[:\-]\s*([^\n]{3,60})/i);
  if(razonMatch) d.nombreFiscal = razonMatch[2].trim();
  // Restaurant name: first line or line with "restaurante"
  const restMatch = text.match(/(restaurante|café|bar|bistro|parrilla|sushi|pizz|comer)[^\n]{2,50}/i);
  if(restMatch) d.nombre = restMatch[0].replace(/restaurante\s*/i,'').trim();
  if(!d.nombre){
    const firstLine = text.split('\n')[0].trim();
    if(firstLine && firstLine.length>2 && firstLine.length<60) d.nombre = firstLine;
  }
  return d;
}

function formatRUT(rut){
  const clean = rut.replace(/[.\-]/g,'');
  if(clean.length<2) return rut;
  const body = clean.slice(0,-1);
  const dv = clean.slice(-1);
  const formatted = body.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return formatted+'-'+dv;
}

function createFromPaste(){

  parsedData={};
  openFicha(c.id);
}

// ═══════════════════════════════════════════════════════════
// REPORTE SEMANAL
// ═══════════════════════════════════════════════════════════
function renderReporteSemanal(){
  const hoy = new Date();
  // Próxima semana: lunes al domingo siguiente
  const dow = hoy.getDay(); // 0=dom, 1=lun...
  const diasHastaLunes = dow === 0 ? 1 : (8 - dow);
  const lunesProx = new Date(hoy); lunesProx.setDate(hoy.getDate() + diasHastaLunes);
  const domProx   = new Date(lunesProx); domProx.setDate(lunesProx.getDate() + 6);
  // Esta semana
  const lunesEsta = new Date(hoy); lunesEsta.setDate(hoy.getDate() - (dow === 0 ? 6 : dow - 1));
  const domenEsta = new Date(lunesEsta); domenEsta.setDate(lunesEsta.getDate() + 6);

  const toYMD = d => d.toISOString().slice(0,10);
  const fmtShort = d => { const [y,m,day] = d.split('-'); return `${day}/${m}`; };

  // ── 1. Reuniones próxima semana ───────────────────────────
  const lunesStr = toYMD(lunesProx);
  const domStr   = toYMD(domProx);
  // From fechaProx field
  const reunProxClients = DB.clientes.filter(c =>
    c.fechaProx && c.fechaProx >= lunesStr && c.fechaProx <= domStr && c.estado !== 'perdido'
  );
  // From interactions of type "reunion" with future date
  const reunProxInter = DB.interacciones.filter(i => {
    if(i.tipo !== 'reunion') return false;
    const fReu = (i.reunionFecha || i.fecha || '').slice(0,10);
    return fReu >= lunesStr && fReu <= domStr;
  });
  const reunProxInterClients = reunProxInter.map(i => {
    const c = DB.clientes.find(x => x.id === i.clienteId);
    return c ? {nombre: c.nombre, fecha: (i.reunionFecha||i.fecha||'').slice(0,10), fuente:'inter'} : null;
  }).filter(Boolean);
  const reunAll = [
    ...reunProxClients.map(c => ({nombre: c.nombre, fecha: c.fechaProx, fuente:'crm'})),
    ...reunProxInterClients
  ].filter((v,i,a) => a.findIndex(x=>x.nombre===v.nombre)===i);

  // ── 2. Pilotos corriendo ───────────────────────────────────
  const pilotos = DB.clientes.filter(c => c.estado === 'periodo_prueba');

  // ── 3. Cierres semana (clientes activos creados esta semana) ─
  const lunesEstaStr = toYMD(lunesEsta);
  const domEstaStr   = toYMD(domenEsta);
  const cierres = DB.clientes.filter(c =>
    c.estado === 'cliente_activo' &&
    c.createdAt && c.createdAt.slice(0,10) >= lunesEstaStr && c.createdAt.slice(0,10) <= domEstaStr
  );

  // ── 4. Actividad semana ───────────────────────────────────
  const interSemana = DB.interacciones.filter(i => {
    const fd = (i.fecha||'').slice(0,10);
    return fd >= lunesEstaStr && fd <= domEstaStr;
  });
  const actCount = {};
  interSemana.forEach(i => { actCount[i.tipo] = (actCount[i.tipo]||0) + 1; });

  // ── 5. Riesgos ────────────────────────────────────────────
  const enRiesgo = DB.clientes.filter(c => c.enRiesgo && c.enRiesgo.trim() && c.estado !== 'perdido');

  // ── 6. Próximos cierres probables ─────────────────────────
  const etapasCierre = ['acuerdo_alcanzado','periodo_prueba','pago_directo','validacion_bot','en_proceso_pago'];
  const probables = DB.clientes.filter(c => etapasCierre.includes(c.estado));

  // ── 7. Negocio en riesgo: no responde ─────────────────────
  const noResponde = DB.clientes.filter(c => {
    if(c.estado === 'perdido') return false;
    if(c.enRiesgo && c.enRiesgo.toLowerCase().includes('no responde')) return true;
    // También: en etapa avanzada y sin contacto en 14 días
    const lastI = DB.interacciones.filter(i=>i.clienteId===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(!lastI) return false;
    const dias = Math.floor((hoy - new Date(lastI.fecha)) / 86400000);
    return etapasCierre.includes(c.estado) && dias >= 14;
  });

  // ── Cálculo MRR ──────────────────────────────────────────
  const UF_CLP = 38500; // valor referencial UF
  function mrr(c){
    if(!c.monto) return '';
    const v = parseFloat(c.monto);
    if(isNaN(v)) return '';
    if(c.monedaTipo === 'UF') return `${c.monto} UF`;
    return `$${Number(c.monto).toLocaleString('es-CL')} CLP`;
  }

  // ── Texto plano para copiar ───────────────────────────────
  function generarTextoReporte(){
    const semStr = `${fmtShort(lunesStr)} al ${fmtShort(domStr)}`;
    let txt = `📊 REPORTE SEMANAL AYHUNGRY\n`;
    txt += `Semana ${fmtShort(toYMD(lunesEsta))} al ${fmtShort(domEstaStr)} (generado ${hoy.toLocaleDateString('es-CL')})\n`;
    txt += `${'─'.repeat(40)}\n\n`;

    txt += `1️⃣  Reuniones próxima semana (${semStr}):\n`;
    if(reunAll.length) reunAll.forEach(r => txt += `  - ${r.nombre}${r.fecha ? ' ('+fmtShort(r.fecha)+')' : ''}\n`);
    else txt += `  Sin reuniones agendadas\n`;

    txt += `\n2️⃣  Pilotos corriendo:\n`;
    if(pilotos.length) pilotos.forEach(c => txt += `  - ${c.nombre}${c.pruebaInicio ? ' (inicio '+fmtShort(c.pruebaInicio)+')' : ''}\n`);
    else txt += `  Sin pilotos activos\n`;

    txt += `\n3️⃣  Cierres semana:\n`;
    if(cierres.length) cierres.forEach(c => txt += `  - ${c.nombre}${mrr(c)?' – '+mrr(c)+' MRR':''}\n`);
    else txt += `  Sin cierres registrados esta semana\n`;

    txt += `\n4️⃣  Actividad:\n`;
    const tipos = Object.entries(actCount);
    if(tipos.length){
      tipos.forEach(([t,n]) => txt += `  - ${n} ${TIPO_LABELS[t]||t}\n`);
      txt += `  - ${interSemana.length} total interacciones\n`;
    } else txt += `  Sin actividad registrada esta semana\n`;

    txt += `\n5️⃣  Riesgos:\n`;
    if(enRiesgo.length) enRiesgo.forEach(c => txt += `  - ${c.nombre}: ${c.enRiesgo}\n`);
    else txt += `  Sin alertas de riesgo\n`;

    txt += `\n6️⃣  Próximos cierres probables:\n`;
    if(probables.length) probables.forEach(c => {
      const etapa = PIPELINE.find(p=>p.id===c.estado);
      txt += `  - ${c.nombre}${etapa?' ('+etapa.label+')':''}\n`;
    });
    else txt += `  Sin cierres probables identificados\n`;

    txt += `\n7️⃣  Negocio en riesgo (no responde):\n`;
    if(noResponde.length) noResponde.forEach(c => txt += `  - ${c.nombre}${c.enRiesgo ? ': '+c.enRiesgo : ''}\n`);
    else txt += `  Sin clientes en riesgo por falta de contacto\n`;

    return txt;
  }

  const semLabel = `${fmtShort(lunesStr)}-${fmtShort(domStr)}`;
  const semActLabel = `${fmtShort(lunesEstaStr)}-${fmtShort(domEstaStr)}`;

  function secBlock(num, emoji, title, items, emptyMsg){
    const rows = items.length ? items.map(it => `
      <div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--accent2);font-size:14px;margin-top:2px">•</span>
        <div>${it}</div>
      </div>`).join('') :
      `<div style="color:var(--text3);font-size:13px;padding:8px 0">${emptyMsg}</div>`;
    return `
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px">
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <span style="background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px">${num}</span>
          ${emoji} ${title}
        </div>
        ${rows}
      </div>`;
  }

  const sec1 = secBlock('1','📅','Reuniones próxima semana <span style="font-size:11px;color:var(--text3)">('+semLabel+')</span>',
    reunAll.map(r => `<b>${esc(r.nombre)}</b>${r.fecha ? ' <span style="color:var(--text3);font-size:12px">'+fmtShort(r.fecha)+'</span>' : ''}`),
    'Sin reuniones agendadas — agrega una fecha en la ficha del cliente');

  const sec2 = secBlock('2','🧪','Pilotos corriendo',
    pilotos.map(c => `<b>${esc(c.nombre)}</b>${c.pruebaInicio ? ' <span style="color:var(--text3);font-size:12px">inicio '+fmtShort(c.pruebaInicio)+'</span>' : ''} <span style="color:var(--text3);font-size:12px">— ${esc(c.contacto||'')}</span>`),
    'Sin pilotos en curso');

  const sec3 = secBlock('3','🎉','Cierres semana <span style="font-size:11px;color:var(--text3)">('+semActLabel+')</span>',
    cierres.map(c => `<b>${esc(c.nombre)}</b>${mrr(c) ? ' <span style="color:var(--green);font-weight:600">'+mrr(c)+' MRR</span>' : ''}`),
    'Sin cierres esta semana — cuando muevas un cliente a "Cliente Activo" aparecerá aquí');

  const actItems = Object.entries(actCount).map(([t,n]) =>
    `<b>${n}</b> ${TIPO_LABELS[t]||t}`
  );
  if(interSemana.length) actItems.push(`<b>${interSemana.length}</b> total de interacciones`);
  const sec4 = secBlock('4','⚡','Actividad <span style="font-size:11px;color:var(--text3)">('+semActLabel+')</span>',
    actItems,
    'Sin actividad registrada esta semana — registra llamadas, demos y reuniones en las fichas');

  const sec5 = secBlock('5','⚠️','Riesgos',
    enRiesgo.map(c => `<b>${esc(c.nombre)}</b> <span style="color:var(--yellow)">— ${esc(c.enRiesgo)}</span>`),
    'Sin alertas de riesgo — puedes agregar una nota de riesgo en la ficha de cada cliente');

  const sec6 = secBlock('6','🎯','Próximos cierres probables',
    probables.map(c => {
      const etapa = PIPELINE.find(p=>p.id===c.estado);
      return `<b>${esc(c.nombre)}</b> <span style="color:${etapa?.color||'var(--text3)'};font-size:12px">${etapa?.label||c.estado}</span>`;
    }),
    'Sin cierres probables identificados');

  const sec7 = secBlock('7','🚨','Negocio en riesgo: no responde contactos',
    noResponde.map(c => `<b>${esc(c.nombre)}</b>${c.enRiesgo ? ' <span style="color:var(--red)">— '+esc(c.enRiesgo)+'</span>' : ' <span style="color:var(--red)">— +14 días sin contacto</span>'}`),
    'Sin clientes en riesgo por falta de contacto');

  return `<div class="page">
    <div class="page-header">
      <div>
        <div class="page-title">📋 Reporte Semanal</div>
        <div class="page-subtitle">Semana del ${fmtShort(lunesEstaStr)} al ${fmtShort(domEstaStr)} · Generado ${hoy.toLocaleDateString('es-CL', {weekday:'long', day:'numeric', month:'long'})}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="copiarReporte()">📋 Copiar reporte</button>
      </div>
    </div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:12px;color:var(--text3);line-height:1.6">
      💡 <strong style="color:var(--text2)">Cómo mejorar el reporte:</strong>
      Para que se auto-complete, registra <b>interacciones</b> (reuniones, demos, propuestas) en cada ficha de cliente.
      Agrega <b>fecha de próxima reunión</b> en cada ficha y una <b>nota de riesgo</b> si un cliente no responde.
    </div>
    ${sec1}${sec2}${sec3}${sec4}${sec5}${sec6}${sec7}
  </div>`;
}

function copiarReporte(){
  const hoy = new Date();
  const dow = hoy.getDay();
  const diasHastaLunes = dow === 0 ? 1 : (8 - dow);
  const lunesProx = new Date(hoy); lunesProx.setDate(hoy.getDate() + diasHastaLunes);
  const domProx = new Date(lunesProx); domProx.setDate(lunesProx.getDate() + 6);
  const lunesEsta = new Date(hoy); lunesEsta.setDate(hoy.getDate() - (dow === 0 ? 6 : dow - 1));
  const domenEsta = new Date(lunesEsta); domenEsta.setDate(lunesEsta.getDate() + 6);
  const toYMD = d => d.toISOString().slice(0,10);
  const fmtShort = d => { const [y,m,day] = d.split('-'); return `${day}/${m}`; };
  const UF_CLP = 38500;
  function mrr(c){ if(!c.monto) return ''; const v=parseFloat(c.monto); if(isNaN(v)) return ''; return c.monedaTipo==='UF'?`${c.monto} UF`:`$${Number(c.monto).toLocaleString('es-CL')} CLP`; }
  const lunesStr=toYMD(lunesProx), domStr=toYMD(domProx), lunesEstaStr=toYMD(lunesEsta), domEstaStr=toYMD(domenEsta);
  const etapasCierre=['acuerdo_alcanzado','periodo_prueba','pago_directo','validacion_bot','en_proceso_pago'];
  const reunAll = DB.clientes.filter(c=>c.fechaProx&&c.fechaProx>=lunesStr&&c.fechaProx<=domStr&&c.estado!=='perdido');
  const pilotos = DB.clientes.filter(c=>c.estado==='periodo_prueba');
  const cierres = DB.clientes.filter(c=>c.estado==='cliente_activo'&&c.createdAt&&c.createdAt.slice(0,10)>=lunesEstaStr&&c.createdAt.slice(0,10)<=domEstaStr);
  const interSemana = DB.interacciones.filter(i=>{const fd=(i.fecha||'').slice(0,10);return fd>=lunesEstaStr&&fd<=domEstaStr;});
  const actCount={};interSemana.forEach(i=>{actCount[i.tipo]=(actCount[i.tipo]||0)+1;});
  const enRiesgo = DB.clientes.filter(c=>c.enRiesgo&&c.enRiesgo.trim()&&c.estado!=='perdido');
  const probables = DB.clientes.filter(c=>etapasCierre.includes(c.estado));
  const noResponde = DB.clientes.filter(c=>{if(c.estado==='perdido')return false;if(c.enRiesgo&&c.enRiesgo.toLowerCase().includes('no responde'))return true;const lastI=DB.interacciones.filter(i=>i.clienteId===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];if(!lastI)return false;const dias=Math.floor((hoy-new Date(lastI.fecha))/86400000);return etapasCierre.includes(c.estado)&&dias>=14;});
  let txt=`📊 REPORTE SEMANAL AYHUNGRY\nSemana ${fmtShort(lunesEstaStr)} al ${fmtShort(domEstaStr)} (${hoy.toLocaleDateString('es-CL')})\n${'─'.repeat(40)}\n\n`;
  txt+=`1️⃣  Reuniones próxima semana (${fmtShort(lunesStr)}-${fmtShort(domStr)}):\n`;
  if(reunAll.length)reunAll.forEach(c=>txt+=`  - ${c.nombre}${c.fechaProx?' ('+fmtShort(c.fechaProx)+')':''}\n`);else txt+=`  Sin reuniones agendadas\n`;
  txt+=`\n2️⃣  Pilotos corriendo:\n`;
  if(pilotos.length)pilotos.forEach(c=>txt+=`  - ${c.nombre}${c.pruebaInicio?' (inicio '+fmtShort(c.pruebaInicio)+')':''}\n`);else txt+=`  Sin pilotos activos\n`;
  txt+=`\n3️⃣  Cierres semana:\n`;
  if(cierres.length)cierres.forEach(c=>txt+=`  - ${c.nombre}${mrr(c)?' – '+mrr(c)+' MRR':''}\n`);else txt+=`  Sin cierres esta semana\n`;
  txt+=`\n4️⃣  Actividad:\n`;
  const tipos=Object.entries(actCount);if(tipos.length){tipos.forEach(([t,n])=>txt+=`  - ${n} ${TIPO_LABELS[t]||t}\n`);txt+=`  - ${interSemana.length} total interacciones\n`;}else txt+=`  Sin actividad registrada esta semana\n`;
  txt+=`\n5️⃣  Riesgos:\n`;
  if(enRiesgo.length)enRiesgo.forEach(c=>txt+=`  - ${c.nombre}: ${c.enRiesgo}\n`);else txt+=`  Sin alertas de riesgo\n`;
  txt+=`\n6️⃣  Próximos cierres probables:\n`;
  if(probables.length)probables.forEach(c=>{const e=PIPELINE.find(p=>p.id===c.estado);txt+=`  - ${c.nombre}${e?' ('+e.label+')':''}\n`;});else txt+=`  Sin cierres probables\n`;
  txt+=`\n7️⃣  Negocio en riesgo (no responde):\n`;
  if(noResponde.length)noResponde.forEach(c=>txt+=`  - ${c.nombre}${c.enRiesgo?': '+c.enRiesgo:' (+14 días sin contacto)'}\n`);else txt+=`  Sin clientes en riesgo\n`;
  navigator.clipboard.writeText(txt).then(()=>showToast('✅ Reporte copiado al portapapeles')).catch(()=>showToast('❌ Error al copiar — intenta seleccionar el texto manualmente','error'));
}

      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">

let _importData = null;
function exportarDatos(){
  saveDB();
  const json = localStorage.getItem(STORAGE_KEY) || JSON.stringify(DB);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
  a.href = url; a.download = `AyHungry_CRM_backup_${ts}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('✅ Backup descargado correctamente');
}

function previsualizarImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      _importData = JSON.parse(ev.target.result);
      const c = (_importData.clientes||[]).length;
      const i = (_importData.interacciones||[]).length;
      document.getElementById('importPreview').innerHTML =
        `<span style="color:var(--green)">✅ Archivo válido — ${c} clientes, ${i} interacciones</span>`;
      document.getElementById('btnConfirmImport').style.display='inline-flex';
    }catch(err){
      document.getElementById('importPreview').innerHTML =
        `<span style="color:var(--red)">❌ Archivo inválido — no es un backup de AyHungry CRM</span>`;
      _importData = null;
      document.getElementById('btnConfirmImport').style.display='none';
    }
  };
  reader.readAsText(file);
}

function confirmarImport(){
  if(!_importData) return;
  if(!confirm(`¿Reemplazar todos los datos actuales con este backup?\n${(_importData.clientes||[]).length} clientes, ${(_importData.interacciones||[]).length} interacciones.\n\nEsta acción no se puede deshacer.`)) return;
  DB = Object.assign({clientes:[],interacciones:[],nextId:1,nextIId:1,lastView:'dashboard'}, _importData);
  saveDB();
  _importData = null;
  showToast(`✅ Datos importados: ${DB.clientes.length} clientes`);
  showView('dashboard');
}

function borrarDemo(){
  const demoNombres = ['Restaurante El Mesón','Sushi Hanako','Parrilla Los Andes','Café La Pérgola','Pizza Pronto'];
  const antes = DB.clientes.length;
  DB.clientes = DB.clientes.filter(c=>!demoNombres.includes(c.nombre));
  const ids = new Set(DB.clientes.map(c=>c.id));
  DB.interacciones = DB.interacciones.filter(i=>ids.has(i.clienteId));
  saveDB();
  const eliminados = antes - DB.clientes.length;
  showToast(eliminados > 0 ? `🗑️ ${eliminados} clientes demo eliminados` : 'No se encontraron clientes demo');
  showView('datos');
}

async function restaurarBackup(){
  if(!confirm('¿Restaurar el último backup guardado? Esto reemplazará los datos actuales del CRM.')) return;
  try{
    const idbJson = await loadLatestFromIDB();
    if(!idbJson){
      showToast('No hay backup disponible. Exporta manualmente desde Configuración.', 'error');
      return;
    }
    const parsed = JSON.parse(idbJson);
    if(!parsed.clientes || parsed.clientes.length === 0){
      showToast('No hay backup disponible. Exporta manualmente desde Configuración.', 'error');
      return;
    }
    DB = Object.assign({clientes:[],interacciones:[],nextId:1,nextIId:1,lastView:'dashboard'}, parsed);
    saveDB();
    showToast('✅ Backup restaurado — ' + DB.clientes.length + ' clientes cargados');
    const msg = document.getElementById('restaurarMsg');
    if(msg){ msg.style.display='block'; setTimeout(()=>msg.style.display='none', 5000); }
    showView('kanban');
  }catch(e){
    console.error('[restaurarBackup] Error al restaurar desde IDB:', new Date().toISOString(), e);
    showToast('Error al restaurar: ' + e.message, 'error');
  }
}
