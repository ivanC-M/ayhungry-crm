<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AyHungry CRM — Portafolio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%231f2320%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2222%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-size%3D%2217%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <h1>Portafolio</h1>
    <p class="top-nav"><a href="resumen.html">Resumen Ejecutivo</a> · <a href="reporte.html">Reporte Semanal</a></p>
    <div id="error" class="error-banner" style="display:none;" role="alert"></div>
    <div class="kpi-grid" id="stats" style="margin-bottom:16px;"></div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
      <label class="visually-hidden" for="search">Buscar por nombre</label>
      <input type="text" id="search" placeholder="Buscar por nombre..." />
      <label class="visually-hidden" for="filter-etapa">Filtrar por etapa</label>
      <select id="filter-etapa"><option value="">Todas las etapas</option></select>
      <label class="visually-hidden" for="filter-tier">Filtrar por tier</label>
      <select id="filter-tier">
        <option value="">Todos los tiers</option>
        <option value="Tier 1">Tier 1</option>
        <option value="Tier 2">Tier 2</option>
        <option value="Tier 3">Tier 3</option>
      </select>
    </div>
    <div class="panel">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Etapa</th><th>Tier</th><th>Último contacto</th><th>Próximo seguimiento</th>
              <th>Monto mensual</th><th>En riesgo</th><th>Nombre</th><th>Grupo</th><th>Contacto</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    const { escapeHtml, apiFetch } = window.AyHungryCRM;
    let allRows = [];

    function urgencyBadge(urgencia) {
      const labels = { overdue: 'Vencido', 'at-risk': 'En riesgo', ok: 'OK' };
      return `<span class="badge badge-${urgencia}">${labels[urgencia]}</span>`;
    }

    function formatMonto(monto, moneda) {
      if (monto === null || monto === undefined) return '—';
      return `${monto.toLocaleString('es-CL')} ${moneda || ''}`.trim();
    }

    function renderStats(rows) {
      const statsEl = document.getElementById('stats');
      const vencidos = rows.filter((r) => r.urgencia === 'overdue').length;
      const enRiesgo = rows.filter((r) => r.urgencia === 'at-risk').length;
      statsEl.innerHTML = `
        <div class="kpi-tile">
          <p class="label">Clientes</p>
          <p class="value">${rows.length}</p>
        </div>
        <div class="kpi-tile ${vencidos > 0 ? 'kpi-tile--critical' : 'kpi-tile--good'}">
          <p class="label">Vencidos</p>
          <p class="value">${vencidos}</p>
        </div>
        <div class="kpi-tile ${enRiesgo > 0 ? 'kpi-tile--warning' : 'kpi-tile--good'}">
          <p class="label">En riesgo</p>
          <p class="value">${enRiesgo}</p>
        </div>
      `;
    }

    function render(rows) {
      renderStats(rows);
      const tbody = document.getElementById('rows');
      if (rows.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="9">Sin resultados para este filtro.</td></tr>';
        return;
      }
      tbody.innerHTML = rows
        .map((r) => `
          <tr class="urgency-${r.urgencia}">
            <td>${escapeHtml(r['Etapa'])}</td>
            <td>${escapeHtml(r['Tier'])}</td>
            <td>${escapeHtml(r['Ultimo contacto'])}</td>
            <td>${escapeHtml(r['Proximo seguimiento'])}</td>
            <td>${formatMonto(r['Monto mensual'], r['Moneda'])}</td>
            <td>${urgencyBadge(r.urgencia)}</td>
            <td><a href="client.html?id=${encodeURIComponent(r.id)}">${escapeHtml(r['Nombre'])}</a></td>
            <td>${escapeHtml(r.grupoNombre)}</td>
            <td>${escapeHtml(r['Teléfono'])}</td>
          </tr>
        `)
        .join('');
    }

    function applyFilters() {
      const search = document.getElementById('search').value.toLowerCase();
      const etapa = document.getElementById('filter-etapa').value;
      const tier = document.getElementById('filter-tier').value;
      const filtered = allRows.filter((r) => {
        const matchesSearch = !search || (r['Nombre'] || '').toLowerCase().includes(search);
        const matchesEtapa = !etapa || r['Etapa'] === etapa;
        const matchesTier = !tier || r['Tier'] === tier;
        return matchesSearch && matchesEtapa && matchesTier;
      });
      render(filtered);
    }

    function populateEtapaFilter(rows) {
      const etapas = [...new Set(rows.map((r) => r['Etapa']).filter(Boolean))].sort();
      const select = document.getElementById('filter-etapa');
      for (const etapa of etapas) {
        const option = document.createElement('option');
        option.value = etapa;
        option.textContent = etapa;
        select.appendChild(option);
      }
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-etapa').addEventListener('change', applyFilters);
    document.getElementById('filter-tier').addEventListener('change', applyFilters);

    apiFetch('/api/portfolio')
      .then((rows) => {
        allRows = rows;
        populateEtapaFilter(rows);
        render(rows);
      })
      .catch((e) => {
        const errorEl = document.getElementById('error');
        errorEl.textContent = 'No se pudo cargar el portafolio. Intenta recargar la página.';
        errorEl.style.display = 'block';
      });
  </script>
</body>
</html>
