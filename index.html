<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AyHungry CRM — Ingreso</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%231f2320%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2222%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-size%3D%2217%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <div class="page">
    <div class="panel">
      <h1 class="login-title">AyHungry CRM</h1>
      <form id="login-form">
        <label class="visually-hidden" for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña" style="width: 100%; margin-bottom: 12px;" />
        <button type="submit" class="primary" style="width: 100%;">Entrar</button>
        <p id="error" role="alert" style="color: #c0392b; font-size: 13px; display: none;"></p>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (!response.ok) throw new Error('bad credentials');
        window.location.href = '/portfolio.html';
      } catch (e) {
        errorEl.textContent = 'Contraseña incorrecta';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
